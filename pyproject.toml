[project]
name = "applycraft-cv-generator"
version = "0.1.0"
description = "Deterministic CV and cover letter generator using local Overleaf templates"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0"
]

[project.scripts]
cv-generator = "cv_generator.cli:main"

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
